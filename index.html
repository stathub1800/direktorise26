<!DOCTYPE html>

    <style>

<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <!-- Container Utama -->
    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Header / Banner -->
        <div class="bg-gradient-to-r from-purple-500 to-indigo-500 rounded-2xl p-6 md:p-10 text-white shadow-lg relative overflow-hidden">
            <div class="relative z-10">
                <div class="flex items-center space-x-3 mb-2">

                        <i class="fas fa-search text-xl"></i>

                <p class="text-purple-100 text-sm md:text-base mt-2">

                </p>
            </div>
            <!-- Dekorasi background -->

            <div class="absolute right-20 bottom-0 w-40 h-40 bg-white opacity-10 rounded-full -mb-10"></div>

            <!-- Form Pencarian NIB -->

                <div class="relative">
                    <i class="fas fa-hashtag absolute left-4 top-3.5 text-gray-400"></i>
                    <input type="text" id="input-nib" placeholder="Masukkan Nomor Induk Berusaha (NIB)..."

                    <div class="relative">

                    </div>

                            <option value="">-- Pilih Kabupaten/Kota (Opsional) --</option>
                            <option value="Bandar Lampung">Bandar Lampung</option>

                            <option value="Lampung Selatan">Lampung Selatan</option>

                            <option value="Lampung Timur">Lampung Timur</option>
                            <option value="Tulang Bawang">Tulang Bawang</option>
                            <option value="Tulang Bawang Barat">Tulang Bawang Barat</option>
                            <option value="Mesuji">Mesuji</option>
                            <option value="Tanggamus">Tanggamus</option>
                            <option value="Pesisir Barat">Pesisir Barat</option>
                            <option value="Way Kanan">Way Kanan</option>
                            <option value="Pringsewu">Pringsewu</option>
                        </select>
                        <i class="fas fa-chevron-down absolute right-4 top-4 text-gray-400 pointer-events-none"></i>
                    </div>

                <div class="bg-blue-50 text-blue-700 p-3 rounded-lg text-sm flex items-start gap-2">
                    <i class="fas fa-info-circle mt-0.5"></i>
                    <p>Pencarian nama/alamat <strong>wajib memilih Provinsi</strong> terlebih dahulu.</p>
                </div>
            </div>

            <!-- Tombol Cari & Tambah & Upload Bulk -->
            <div class="mt-6 flex flex-col sm:flex-row justify-between items-center gap-4 border-t pt-6">
                <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto items-center">
                    <button onclick="bukaModalTambah()" class="text-purple-600 font-medium hover:text-purple-800 transition-colors flex items-center gap-2">
                        <i class="fas fa-plus-circle"></i> Tambah Baru

                    <span class="hidden sm:inline text-gray-300">|</span>
                    
                    <!-- Form Hidden untuk File CSV -->
                    <input type="file" id="input-csv" accept=".csv" class="hidden" onchange="prosesUploadCSV(event)">
                    <button onclick="document.getElementById('input-csv').click()" class="text-green-600 font-medium hover:text-green-800 transition-colors flex items-center gap-2 bg-green-50 px-3 py-1.5 rounded-lg border border-green-200">
                        <i class="fas fa-file-csv"></i> Upload Data CSV
                    </button>
                </div>

                <button onclick="cariUsaha()" class="w-full sm:w-auto bg-purple-500 hover:bg-purple-600 text-white px-8 py-3 rounded-xl font-medium transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2">
                    <i class="fas fa-search"></i> Cari Data

        <!-- Notifikasi (Custom Alert) -->

            <i id="notif-icon" class="fas fa-info-circle mt-0.5 text-lg"></i>
            <span id="notif-pesan"></span>
        </div>

        <!-- Hasil Pencarian -->
        <div id="hasil-container" class="hidden space-y-4">
            <div class="flex items-center justify-between bg-purple-50 text-purple-700 px-4 py-2 rounded-lg text-sm font-medium w-max">
                <i class="fas fa-list-ul mr-2"></i> <span id="jumlah-hasil">Menampilkan 0 hasil</span>
            </div>

            <div id="list-usaha" class="space-y-4">
                <!-- Data akan di-render di sini oleh JavaScript -->
            </div>
        </div>
    </div>

    <!-- Modal Tambah Usaha -->
    <div id="modal-tambah" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl transform transition-all">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800">Tambah Usaha Baru</h2>
                <button onclick="tutupModalTambah()" class="text-gray-400 hover:text-red-500 text-xl transition-colors"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nomor Induk Berusaha (NIB) *</label>
                    <input type="text" id="tambah-nib" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Usaha *</label>
                    <input type="text" id="tambah-nama" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Provinsi *</label>
                    <input type="text" value="LAMPUNG" readonly class="w-full p-3 bg-gray-100 border border-gray-200 rounded-xl text-gray-500 cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Kabupaten/Kota *</label>
                    <select id="tambah-kab" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none">
                        <option value="Bandar Lampung">Bandar Lampung</option>
                        <option value="Metro">Metro</option>
                        <option value="Pesawaran">Pesawaran</option>
                        <option value="Lampung Selatan">Lampung Selatan</option>
                        <option value="Lampung Tengah">Lampung Tengah</option>
                        <option value="Lampung Utara">Lampung Utara</option>
                        <option value="Lampung Barat">Lampung Barat</option>
                        <option value="Lampung Timur">Lampung Timur</option>
                        <option value="Tulang Bawang">Tulang Bawang</option>
                        <option value="Tulang Bawang Barat">Tulang Bawang Barat</option>
                        <option value="Mesuji">Mesuji</option>
                        <option value="Tanggamus">Tanggamus</option>
                        <option value="Pesisir Barat">Pesisir Barat</option>
                        <option value="Way Kanan">Way Kanan</option>
                        <option value="Pringsewu">Pringsewu</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Alamat Lengkap *</label>
                    <textarea id="tambah-alamat" rows="2" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Alamat Email *</label>
                    <input type="email" id="tambah-email" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none">
                </div>
            </div>
            <div class="p-6 border-t border-gray-100 bg-gray-50 rounded-b-2xl flex justify-end gap-3">
                <button onclick="tutupModalTambah()" class="px-5 py-2.5 rounded-xl text-gray-600 font-medium hover:bg-gray-200 transition-colors">Batal</button>
                <button onclick="simpanUsahaBaru()" class="px-5 py-2.5 rounded-xl bg-purple-500 text-white font-medium hover:bg-purple-600 transition-colors">Simpan Data</button>
            </div>

    <!-- SCRIPT FIREBASE & LOGIKA UTAMA -->
    <script type="module">
        // 1. Import fungsi-fungsi Firebase yang dibutuhkan (menambahkan writeBatch)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            getDocs, 
            addDoc, 
            doc, 
            updateDoc, 
            query, 
            where,
            writeBatch
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // 2. PASTE FIREBASE CONFIG ANDA DI SINI
        const firebaseConfig = {
            apiKey: "AIzaSyDT3VUNM6LZYZItOtuyItqXYVvG6J8fx-s",
            authDomain: "se2026-f3003.firebaseapp.com",
            projectId: "se2026-f3003",
            storageBucket: "se2026-f3003.firebasestorage.app",
            messagingSenderId: "80341327498",
            appId: "1:80341327498:web:0cf9a854246eb784be5773"
        };

        // Inisialisasi Firebase & Database
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Nama koleksi (tabel) di database Anda
        const NAMA_KOLEKSI = "perusahaan";

        // ==========================================
        // LOGIKA TAMPILAN (TAB & MODAL)
        // ==========================================
        let modePencarian = 'nib'; 

        window.switchTab = function(tab) {
            modePencarian = tab;
            const tabNib = document.getElementById('tab-nib');
            const tabNama = document.getElementById('tab-nama');
            const formNib = document.getElementById('form-nib');
            const formNama = document.getElementById('form-nama');

            if (tab === 'nib') {
                tabNib.className = "tab-active px-5 py-2.5 rounded-full text-sm font-medium transition-colors border flex items-center gap-2";
                tabNama.className = "tab-inactive px-5 py-2.5 rounded-full text-sm font-medium transition-colors border flex items-center gap-2";
                formNib.classList.remove('hidden');
                formNama.classList.add('hidden');
            } else {
                tabNama.className = "tab-active px-5 py-2.5 rounded-full text-sm font-medium transition-colors border flex items-center gap-2";
                tabNib.className = "tab-inactive px-5 py-2.5 rounded-full text-sm font-medium transition-colors border flex items-center gap-2";
                formNama.classList.remove('hidden');
                formNib.classList.add('hidden');
            }
        };

        window.bukaModalTambah = function() {
            document.getElementById('modal-tambah').classList.remove('hidden');
            document.getElementById('modal-tambah').classList.add('flex');
        };

        window.tutupModalTambah = function() {
            document.getElementById('modal-tambah').classList.add('hidden');
            document.getElementById('modal-tambah').classList.remove('flex');
        };

        window.tampilkanNotif = function(pesan, tipe = 'info', tahanLama = false) {
            const notif = document.getElementById('notifikasi');
            const ikon = document.getElementById('notif-icon');
            const teks = document.getElementById('notif-pesan');
            
            notif.classList.remove('hidden', 'bg-blue-50', 'text-blue-700', 'bg-red-50', 'text-red-700', 'bg-green-50', 'text-green-700', 'bg-yellow-50', 'text-yellow-700');
            
            if (tipe === 'error') {
                notif.classList.add('bg-red-50', 'text-red-700');
                ikon.className = 'fas fa-exclamation-triangle mt-0.5 text-lg';
            } else if (tipe === 'success') {
                notif.classList.add('bg-green-50', 'text-green-700');
                ikon.className = 'fas fa-check-circle mt-0.5 text-lg';
            } else if (tipe === 'warning') {
                notif.classList.add('bg-yellow-50', 'text-yellow-700');
                ikon.className = 'fas fa-spinner fa-spin mt-0.5 text-lg';
            } else {
                notif.classList.add('bg-blue-50', 'text-blue-700');
                ikon.className = 'fas fa-info-circle mt-0.5 text-lg';
            }

            teks.innerHTML = pesan;
            
            if (!tahanLama) {
                setTimeout(() => notif.classList.add('hidden'), 6000);
            }
        };

        // ==========================================
        // LOGIKA BULK UPLOAD DARI CSV (PAPAPARSE)
        // ==========================================
        window.prosesUploadCSV = function(event) {
            const file = event.target.files[0];
            if(!file) return;

            window.tampilkanNotif("Sedang membaca file CSV... Mohon tunggu.", "warning", true);

            // Gunakan PapaParse untuk membaca format CSV yang rumit (ada koma di dalam teks)
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: async function(results) {
                    const data = results.data;
                    if(data.length === 0) {
                        window.tampilkanNotif("File CSV kosong atau format salah.", "error");
                        document.getElementById('input-csv').value = '';
                        return;
                    }

                    window.tampilkanNotif(`Mulai mengirim ${data.length} data ke database... <b>JANGAN TUTUP HALAMAN INI</b>.`, "warning", true);

                    try {
                        let batch = writeBatch(db);
                        let hitungBatch = 0;
                        let totalBerhasil = 0;

                        // Looping semua baris di file CSV
                        for (const baris of data) {
                            // Mencocokkan nama kolom yang ada di file Excel/CSV Anda
                            const namaUsaha = baris['Nama Usaha'] || baris['Nama Komersil'] || '';
                            const nib = baris['NIB'] || '';
                            const prov = (baris['prov'] || 'LAMPUNG').toUpperCase();
                            const kab = baris['kabkot'] || '';
                            const alamat = baris['Alamat'] || '';

                            // Lewati jika datanya benar-benar kosong
                            if (!namaUsaha && !nib) continue;

                            const docRef = doc(collection(db, NAMA_KOLEKSI));
                            batch.set(docRef, {
                                nib: nib,
                                nama: namaUsaha,
                                provinsi: prov,
                                kabupaten: kab,
                                alamat: alamat,
                                email: "",
                                email_terverifikasi: false,
                                waktu_dibuat: new Date()
                            });

                            hitungBatch++;
                            totalBerhasil++;

                            // Firestore membatasi maksimal 500 penulisan dalam 1 batch
                            if (hitungBatch === 490) {
                                await batch.commit(); // Kirim batch ke server
                                batch = writeBatch(db); // Buat antrian batch baru
                                hitungBatch = 0;
                            }
                        }

                        // Kirim sisa data yang kurang dari 500
                        if (hitungBatch > 0) {
                            await batch.commit();
                        }

                        window.tampilkanNotif(`<b>SUKSES!</b> ${totalBerhasil} data usaha berhasil diunggah ke database.`, "success");
                        document.getElementById('input-csv').value = ''; // Reset input
                        
                    } catch (error) {
                        console.error("Error bulk upload:", error);
                        window.tampilkanNotif("Terjadi kesalahan sistem saat mengirim data ke database.", "error");
                        document.getElementById('input-csv').value = '';
                    }
                }
            });
        };

        // ==========================================
        // LOGIKA PENCARIAN (BACA DARI FIREBASE)
        // ==========================================
        window.cariUsaha = async function() {
            const labelJumlah = document.getElementById('jumlah-hasil');
            labelJumlah.innerText = "Mencari data ke database...";
            document.getElementById('hasil-container').classList.remove('hidden');
            document.getElementById('list-usaha').innerHTML = '<div class="text-center p-4 text-gray-500"><i class="fas fa-spinner fa-spin text-2xl mb-2"></i><p>Memuat...</p></div>';

            try {
                let hasilPencarian = [];
                const perusahaanRef = collection(db, NAMA_KOLEKSI);
                
                if (modePencarian === 'nib') {
                    const nibVal = document.getElementById('input-nib').value.trim();
                    if (!nibVal) {
                        window.tampilkanNotif("Harap masukkan nomor NIB.", "error");
                        return renderHasil([]);
                    }
                    
                    const q = query(perusahaanRef, where("nib", "==", nibVal));
                    const querySnapshot = await getDocs(q);
                    
                    querySnapshot.forEach((doc) => {
                        hasilPencarian.push({ id: doc.id, ...doc.data() });
                    });
                } 
                else {
                    const namaVal = document.getElementById('input-nama').value.trim().toLowerCase();
                    const alamatVal = document.getElementById('input-alamat').value.trim().toLowerCase();
                    const provVal = document.getElementById('select-provinsi').value;
                    const kabVal = document.getElementById('select-kabupaten').value;

                    if (!provVal) {
                        window.tampilkanNotif("Provinsi wajib dipilih jika mencari berdasarkan Nama/Alamat.", "error");
                        return renderHasil([]);
                    }
                    if (!namaVal && !alamatVal) {
                        window.tampilkanNotif("Harap masukkan setidaknya Nama Usaha atau Alamat.", "error");
                        return renderHasil([]);
                    }

                    let q;
                    if (kabVal) {
                        q = query(perusahaanRef, where("provinsi", "==", provVal), where("kabupaten", "==", kabVal));
                    } else {
                        q = query(perusahaanRef, where("provinsi", "==", provVal));
                    }

                    const querySnapshot = await getDocs(q);
                    let semuaDataWilayah = [];
                    querySnapshot.forEach((doc) => {
                        semuaDataWilayah.push({ id: doc.id, ...doc.data() });
                    });

                    hasilPencarian = semuaDataWilayah.filter(u => {
                        let cocok = true;
                        if (namaVal && u.nama) {
                            cocok = cocok && u.nama.toLowerCase().includes(namaVal);
                        }
                        if (alamatVal && u.alamat) {
                            cocok = cocok && u.alamat.toLowerCase().includes(alamatVal);
                        }
                        return cocok;
                    });
                }

                renderHasil(hasilPencarian);

            } catch (error) {
                console.error("Error mengambil data:", error);
                window.tampilkanNotif("Gagal mengambil data. Pastikan konfigurasi Firebase sudah benar.", "error");
                renderHasil([]);
            }
        };

        function renderHasil(hasil) {
            const container = document.getElementById('hasil-container');
            const list = document.getElementById('list-usaha');
            const labelJumlah = document.getElementById('jumlah-hasil');

            list.innerHTML = '';
            container.classList.remove('hidden');

            if (hasil.length === 0) {
                labelJumlah.innerText = "Tidak ada hasil ditemukan";
                list.innerHTML = `
                    <div class="bg-white p-8 text-center rounded-xl border border-gray-100 shadow-sm text-gray-500">
                        <i class="fas fa-search-minus text-4xl mb-3 text-gray-300"></i>
                        <p>Data usaha tidak ditemukan. Silakan cek kembali kata kunci atau gunakan tombol 'Tambah Baru'.</p>
                    </div>`;
                return;
            }

            labelJumlah.innerText = `Menampilkan ${hasil.length} hasil`;

            hasil.forEach(usaha => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow";
                
                let badgeEmail = '';
                if (usaha.email_terverifikasi) {
                    badgeEmail = `<span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded-md font-medium"><i class="fas fa-check-circle"></i> Email Terverifikasi</span>`;
                } else if (!usaha.email) {
                    badgeEmail = `<span class="bg-red-100 text-red-700 text-xs px-2 py-1 rounded-md font-medium"><i class="fas fa-exclamation-circle"></i> Email Kosong</span>`;
                } else {
                    badgeEmail = `<span class="bg-yellow-100 text-yellow-700 text-xs px-2 py-1 rounded-md font-medium"><i class="fas fa-clock"></i> Belum Diverifikasi</span>`;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-xl font-bold text-gray-800">${usaha.nama || '-'}</h3>
                            <div class="flex items-center gap-3 mt-2 text-sm">
                                <span class="bg-purple-100 text-purple-700 px-2.5 py-1 rounded-md font-semibold font-mono border border-purple-200">
                                    NIB: ${usaha.nib || '-'}
                                </span>
                                <span class="text-gray-500"><i class="fas fa-map-marker-alt text-purple-400"></i> ${usaha.kabupaten || '-'}</span>
                            </div>
                        </div>
                        ${badgeEmail}
                    </div>
                    <p class="text-gray-600 text-sm mb-4"><i class="fas fa-home text-gray-400 w-5"></i> ${usaha.alamat || '-'}</p>
                    
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                        <p class="text-sm font-medium text-gray-700 mb-2">Verifikasi Email Perusahaan:</p>
                        <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-center">
                            <input type="email" id="email-${usaha.id}" value="${usaha.email || ''}" placeholder="Masukkan email aktif..." 
                                   class="flex-1 w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                            
                            <label class="flex items-center gap-2 cursor-pointer text-sm text-gray-700 bg-white border border-gray-300 px-3 py-2.5 rounded-lg w-full sm:w-auto">
                                <input type="checkbox" id="cek-${usaha.id}" class="w-4 h-4 text-purple-600 rounded" ${usaha.email_terverifikasi ? 'checked' : ''}>
                                Email ini sudah benar
                            </label>
                            
                            <button id="btn-simpan-${usaha.id}" onclick="simpanVerifikasi('${usaha.id}')" class="w-full sm:w-auto bg-green-500 hover:bg-green-600 text-white px-5 py-2.5 rounded-lg font-medium transition-colors shadow-sm">
                                Simpan
                            </button>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        // ==========================================
        // LOGIKA SIMPAN & UPDATE (TULIS KE FIREBASE)
        // ==========================================
        window.simpanVerifikasi = async function(id) {
            const emailBaru = document.getElementById(`email-${id}`).value.trim();
            const dicentang = document.getElementById(`cek-${id}`).checked;
            const tombolSimpan = document.getElementById(`btn-simpan-${id}`);

            if (!emailBaru) {
                window.tampilkanNotif("Alamat email tidak boleh kosong!", "error");
                return;
            }
            if (!dicentang) {
                window.tampilkanNotif("Harap ceklis kotak 'Email ini sudah benar' untuk memverifikasi.", "error");
                return;
            }

            const teksAwal = tombolSimpan.innerHTML;
            tombolSimpan.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
            tombolSimpan.disabled = true;

            try {
                const docRef = doc(db, NAMA_KOLEKSI, id);
                await updateDoc(docRef, { 
                    email: emailBaru, 
                    email_terverifikasi: true 
                });
                
                window.tampilkanNotif(`Data email berhasil diverifikasi dan disimpan!`, "success");
                window.cariUsaha(); 
            } catch (error) {
                console.error("Error update data:", error);
                window.tampilkanNotif("Gagal menyimpan data ke database.", "error");
                tombolSimpan.innerHTML = teksAwal;
                tombolSimpan.disabled = false;
            }
        };

        window.simpanUsahaBaru = async function() {
            const nib = document.getElementById('tambah-nib').value.trim();
            const nama = document.getElementById('tambah-nama').value.trim();
            const kab = document.getElementById('tambah-kab').value;
            const alamat = document.getElementById('tambah-alamat').value.trim();
            const email = document.getElementById('tambah-email').value.trim();

            if(!nib || !nama || !alamat || !email) {
                alert("Harap isi semua kolom yang wajib (*)");
                return;
            }

            const tombolSimpanBtn = document.querySelector('#modal-tambah button.bg-purple-500');
            const teksAwalBtn = tombolSimpanBtn.innerText;
            tombolSimpanBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
            tombolSimpanBtn.disabled = true;

            try {
                const usahaBaru = {
                    nib: nib,
                    nama: nama,
                    provinsi: "LAMPUNG",
                    kabupaten: kab,
                    alamat: alamat,
                    email: email,
                    email_terverifikasi: false,
                    waktu_dibuat: new Date()
                };

                await addDoc(collection(db, NAMA_KOLEKSI), usahaBaru);
                
                window.tutupModalTambah();
                window.tampilkanNotif("Usaha baru berhasil ditambahkan! Anda bisa mencari datanya sekarang.", "success");
                
                document.getElementById('tambah-nib').value = '';
                document.getElementById('tambah-nama').value = '';
                document.getElementById('tambah-alamat').value = '';
                document.getElementById('tambah-email').value = '';
            } catch (error) {
                console.error("Error tambah data:", error);
                window.tampilkanNotif("Gagal menambahkan usaha baru ke database.", "error");
            } finally {
                tombolSimpanBtn.innerHTML = teksAwalBtn;
                tombolSimpanBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
